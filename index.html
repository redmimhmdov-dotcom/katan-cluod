<!doctype html>
<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محاسبة قطان 2026</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <!-- منع تحميل شارة Bolt وإضافة تذييل مخصص -->
    <script>
      // إلغاء تحميل شارة Bolt نهائياً
      const originalCreateElement = document.createElement;
      document.createElement = function(tagName, options) {
        const element = originalCreateElement.call(this, tagName, options);
        if (tagName === 'script' && options?.src?.includes('badge.js')) {
          return null;
        }
        return element;
      };

      // إضافة التذييل المخصص بعد تحميل الصفحة
      window.addEventListener('DOMContentLoaded', function() {
        // إزالة أي شارة موجودة من Bolt
        const boltBadge = document.querySelector('[style*="position: fixed"][style*="bottom: 1rem"][style*="right: 1rem"]');
        if (boltBadge) {
          boltBadge.remove();
        }

        // إنشاء التذييل المخصص
        const footer = document.createElement('div');
        footer.style.cssText = `
          position: fixed;
          bottom: 16px;
          right: 16px;
          z-index: 2147483647;
          background: white;
          padding: 8px 16px;
          border-radius: 8px;
          box-shadow: 0px 4px 6px -1px rgba(0, 0, 0, 0.10), 0px 2px 4px -1px rgba(0, 0, 0, 0.06);
          border: 1px solid #E1F2FF;
          font-family: 'Cairo', 'Tajawal', system-ui, sans-serif;
          font-size: 14px;
          font-weight: 600;
          color: #1a1a1a;
          display: flex;
          align-items: center;
          gap: 6px;
          direction: rtl;
        `;

        // أيقونة يدوية (بديل عن شعار Bolt)
        const icon = document.createElement('span');
        icon.style.cssText = `
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 24px;
          height: 24px;
          background: linear-gradient(135deg, #10b981, #059669);
          border-radius: 4px;
          color: white;
          font-size: 12px;
          font-weight: bold;
        `;
        icon.textContent = 'م';

        // النص
        const text = document.createElement('span');
        text.textContent = 'تم التصميم من قبل محمد الحسين';

        footer.appendChild(icon);
        footer.appendChild(text);
        document.body.appendChild(footer);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
